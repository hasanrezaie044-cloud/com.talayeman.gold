name: Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do NOT install obsolete package "tools" (removed by Google; causes sdkmanager exit 1)
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check release signing secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Release signing secrets are missing."
            echo "Required repository secrets:"
            echo "  KEYSTORE_BASE64  - Base64-encoded keystore file"
            echo "  KEYSTORE_PASSWORD"
            echo "  KEY_ALIAS"
            echo "  KEY_PASSWORD"
            echo "Do NOT generate a fallback keystore. Do NOT use debug signing for release."
            exit 1
          fi
          echo "Signing secrets present."

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK exists
        id: verify
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          VERSION_NAME=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "=== Build Info ==="
          echo "Application ID: com.talayeman.gold"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "APK path: $APK_PATH"
          echo "APK size: $SIZE bytes"
          echo "SHA-256: $SHA256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-management-release-${{ env.VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks
